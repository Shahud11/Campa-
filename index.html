<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAMPA</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f4f1ff;
  color:#17122d;
}

button,input{font:inherit}
button{cursor:pointer}

.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:#faf9ff;
}

.screen{display:none;min-height:100vh;padding-bottom:80px}
.screen.active{display:block}

/* AUTH */

.auth{
  min-height:100vh;
  padding:35px 22px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:linear-gradient(145deg,#18002f,#6419c7);
  color:white;
}

.auth-logo{
  width:82px;
  height:82px;
  margin:0 auto 18px;
  display:grid;
  place-items:center;
  border-radius:24px;
  background:linear-gradient(145deg,#ffc229,#8739ff);
  font-size:34px;
  font-weight:900;
}

.auth h1{
  text-align:center;
  font-size:35px;
  letter-spacing:2px;
}

.auth-sub{
  text-align:center;
  margin:7px 0 25px;
  opacity:.8;
}

.auth-box{
  background:white;
  color:#17122d;
  padding:23px;
  border-radius:22px;
}

.auth-box h2{margin-bottom:18px}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:700;
}

.field input{
  width:100%;
  padding:13px;
  border:1px solid #ddd8e8;
  border-radius:10px;
  outline:none;
}

.field input:focus{
  border-color:#661bc7;
}

.primary{
  width:100%;
  border:0;
  border-radius:11px;
  padding:14px;
  background:#631bc4;
  color:white;
  font-weight:800;
}

.switch{
  border:0;
  background:none;
  color:#631bc4;
  font-weight:800;
}

.auth-footer{
  margin-top:16px;
  text-align:center;
  font-size:13px;
  color:#666;
}

.demo{
  display:inline-block;
  padding:5px 9px;
  border-radius:7px;
  background:#fff1c7;
  color:#8b6500;
  font-size:10px;
  font-weight:800;
}

/* APP */

header{
  padding:22px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:23px;
  font-weight:900;
}

.mini-logo{
  display:inline-grid;
  place-items:center;
  width:34px;
  height:34px;
  margin-right:6px;
  border-radius:10px;
  background:#ffbd24;
}

.sub{
  color:#777;
  font-size:13px;
  margin-top:4px;
}

.balance{
  margin:0 20px 20px;
  padding:24px;
  border-radius:23px;
  color:white;
  background:linear-gradient(135deg,#5915b8,#8938e9);
}

.balance small{opacity:.8}
.balance h2{font-size:32px;margin:10px 0 20px}

.actions{
  display:flex;
  gap:10px;
}

.actions button{
  flex:1;
  border:0;
  padding:11px;
  border-radius:10px;
  background:white;
  color:#5c17b6;
  font-weight:800;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:0 20px;
}

.card{
  padding:18px 7px;
  border-radius:16px;
  background:white;
  border:1px solid #ece9f5;
  text-align:center;
}

.card:active{transform:scale(.97)}

.icon{font-size:24px}

.card span{
  display:block;
  margin-top:8px;
  font-size:12px;
}

.invite{
  margin:20px;
  padding:20px;
  border-radius:18px;
  background:#eee5ff;
}

.invite p{
  margin-top:8px;
  color:#666;
  font-size:14px;
}

.invite button{
  margin-top:15px;
  border:0;
  padding:11px 18px;
  border-radius:10px;
  background:#5c17b6;
  color:white;
  font-weight:700;
}

.page-title{
  padding:0 20px 20px;
}

.page-title h2{font-size:27px}

.page-title p{
  margin-top:7px;
  color:#777;
}

.list{padding:0 20px}

.list-card{
  margin-bottom:12px;
  padding:18px;
  border-radius:17px;
  background:white;
  border:1px solid #ece9f5;
}

.list-card h3{margin-bottom:7px}

.list-card p{
  color:#777;
  font-size:14px;
  margin-bottom:12px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.small-btn{
  border:0;
  padding:10px 14px;
  border-radius:9px;
  background:#631bc4;
  color:white;
  font-weight:700;
}

.back{
  margin:0 20px 20px;
  border:0;
  background:#eee8fb;
  color:#5c17b6;
  padding:11px 18px;
  border-radius:10px;
  font-weight:700;
}

.profile-box{
  margin:0 20px 15px;
  padding:22px;
  border-radius:20px;
  background:white;
  border:1px solid #ece9f5;
}

.avatar{
  width:65px;
  height:65px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#eadcff;
  font-size:27px;
  margin-bottom:12px;
}

.logout{
  margin:20px;
  width:calc(100% - 40px);
  border:0;
  padding:13px;
  border-radius:11px;
  background:#eee8fb;
  color:#5c17b6;
  font-weight:800;
}

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(480px,100%);
  display:flex;
  justify-content:space-around;
  padding:10px 3px;
  background:white;
  border-top:1px solid #e9e6f0;
  z-index:20;
}

nav button{
  border:0;
  background:none;
  color:#777;
  font-size:18px;
}

nav button.active{color:#5d17b8}

nav span{
  display:block;
  font-size:10px;
  margin-top:3px;
}

.notice{
  padding:10px;
  margin-bottom:15px;
  border-radius:9px;
  background:#fff4d6;
  color:#765700;
  font-size:12px;
  text-align:center;
}
</style>
</head>

<body>

<div class="app">

<!-- AUTH SCREEN -->

<section id="auth" class="auth">

  <div class="auth-logo">C↗</div>

  <h1>CAMPA</h1>

  <p class="auth-sub">Smart. Simple. Original.</p>

  <div class="auth-box">

    <div class="notice">
      DEMO PROTOTYPE — No real account or payment is created.
    </div>

    <!-- LOGIN -->

    <div id="loginBox">

      <h2>Welcome Back</h2>

      <div class="field">
        <label>Email</label>
        <input id="loginEmail" type="email" placeholder="Enter email">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Enter password">
      </div>

      <button class="primary" onclick="demoLogin()">
        Login
      </button>

      <div class="auth-footer">
        New to CAMPA?
        <button class="switch" onclick="showSignup()">
          Create Account
        </button>
      </div>

    </div>


    <!-- SIGNUP -->

    <div id="signupBox" style="display:none">

      <h2>Create Account</h2>

      <div class="field">
        <label>Name</label>
        <input id="signupName" type="text" placeholder="Your name">
      </div>

      <div class="field">
        <label>Email</label>
        <input id="signupEmail" type="email" placeholder="Your email">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="signupPassword" type="password" placeholder="Create password">
      </div>

      <div class="field">
        <label>Confirm Password</label>
        <input id="signupConfirm" type="password" placeholder="Confirm password">
      </div>

      <button class="primary" onclick="demoSignup()">
        Create Demo Account
      </button>

      <div class="auth-footer">
        Already have an account?
        <button class="switch" onclick="showLogin()">
          Login
        </button>
      </div>

    </div>

  </div>

</section>


<!-- HOME -->

<section id="home" class="screen">

<header>

  <div>
    <div class="brand">
      <span class="mini-logo">C↗</span>CAMPA
    </div>

    <div class="sub">
      Welcome back 👋
    </div>
  </div>

  <div>🔔</div>

</header>


<div class="balance">

  <small>DEMO BALANCE</small>

  <h2>₹10,500.00</h2>

  <div class="actions">

    <button onclick="showPage('wallet')">
      Wallet
    </button>

    <button onclick="showPage('history')">
      History
    </button>

  </div>

</div>


<div class="grid">

<button class="card" onclick="showPage('plans')">
  <div class="icon">📊</div>
  <span>Plans</span>
</button>

<button class="card" onclick="showPage('wallet')">
  <div class="icon">💰</div>
  <span>Wallet</span>
</button>

<button class="card" onclick="showPage('deposit')">
  <div class="icon">➕</div>
  <span>Deposit</span>
</button>

<button class="card" onclick="showPage('withdraw')">
  <div class="icon">↥</div>
  <span>Withdraw</span>
</button>

<button class="card" onclick="showPage('referral')">
  <div class="icon">👥</div>
  <span>Referral</span>
</button>

<button class="card" onclick="showPage('history')">
  <div class="icon">📜</div>
  <span>History</span>
</button>

</div>


<div class="invite">

<h3>Invite & Connect</h3>

<p>
Share your CAMPA demo referral code with friends.
</p>

<button onclick="shareReferral()">
Share Referral
</button>

</div>


<nav>

<button onclick="showPage('home')" data-page="home">
⌂<span>Home</span>
</button>

<button onclick="showPage('plans')" data-page="plans">
▣<span>Plans</span>
</button>

<button onclick="showPage('wallet')" data-page="wallet">
▤<span>Wallet</span>
</button>

<button onclick="showPage('referral')" data-page="referral">
♧<span>Referral</span>
</button>

<button onclick="showPage('profile')" data-page="profile">
●<span>Profile</span>
</button>

</nav>

</section>


<!-- OTHER PAGES -->

<section id="content" class="screen"></section>

</div>


<script>

function showLogin(){

  document.getElementById("loginBox").style.display="block";
  document.getElementById("signupBox").style.display="none";

}


function showSignup(){

  document.getElementById("loginBox").style.display="none";
  document.getElementById("signupBox").style.display="block";

}


function demoSignup(){

  const name=document.getElementById("signupName").value.trim();
  const email=document.getElementById("signupEmail").value.trim();
  const password=document.getElementById("signupPassword").value;
  const confirm=document.getElementById("signupConfirm").value;

  if(!name || !email || !password || !confirm){

    alert("Please fill all fields.");

    return;
  }

  if(password!==confirm){

    alert("Passwords do not match.");

    return;
  }

  alert(
    "Demo account created successfully for " +
    name +
    "."
  );

  showLogin();

}


function demoLogin(){

  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;

  if(!email || !password){

    alert("Please enter email and password.");

    return;
  }

  openApp();

}


function openApp(){

  document.getElementById("auth").style.display="none";

  showPage("home");

}


function showPage(page){

  const home=document.getElementById("home");
  const content=document.getElementById("content");

  if(page==="home"){

    home.classList.add("active");
    content.classList.remove("active");

    setActive("home");

    return;
  }

  home.classList.remove("active");
  content.classList.add("active");

  setActive(page);

  let html="";

    html=`

<div class="list">

onclick="selectPlan('Starter')">
Select

onclick="selectPlan('Growth')">

</button>

</div>

<button class="small-btn"
onclick="selectPlan('Premium')">
Select
</button>

</div>

</div>

</div>

<button class="back"
onclick="showPage('home')">
← Back Home
</button>

`;

  }


  if(page==="wallet"){

    html=`

</div>

<p>Prototype wallet overview.</p>

</div>

</div>


<div class="list">

</div>

<p>Real-money transactions are disabled.</p>

<button class="small-btn"
onclick="showPage('deposit')">
Demo Deposit
</button>

<button class="small-btn"
onclick="showPage('withdraw')">
Demo Withdraw
</button>

</div>

</div>


<button class="back"
onclick="showPage('home')">
← Back Home
</button>

`;

  }


  if(page==="deposit"){

    html=`

<header>

<div class="brand">
<span class="mini-logo">C↗</span>CAMPA
</div>

<div>➕</div>

</header>

</div>


<div class="list">

<h3 style="margin-top:10px">

</h3>

<button class="small-btn"
onclick="demoAction('₹500 Demo Deposit')">
₹500

onclick="demoAction('₹1,000 Demo Deposit')">
₹1,000

<button class="small-btn"
onclick="demoAction('₹5,000 Demo Deposit')">
₹5,000
</button>

</div>

</div>


<button class="back"
onclick="showPage('wallet')">
← Back to Wallet
</button>

`;

  }


  if(page==="withdraw"){

    html=`

<div class="brand">
<span class="mini-logo">C↗</span>CAMPA
</div>

<div>↥</div>

</header>


<div class="page-title">

<div class="list">

`;

  }


  if(page==="referral"){

    html=`

</div>

`;

  }


  if(page==="history"){

    html=`

<header>

<div class="brand">

</div>

</header>


<div class="page-title">

</div>


<div class="list">

  }


  if(page==="profile"){

    html=`

<header>

<div class="brand">
<span class="mini-logo">C↗</span>CAMPA
</div>

<div>👤</div>

</header>

</div>

<div class="avatar">👤</div>

demo@campa.app
</p>

<br>

<span class="demo">
DEMO ACCOUNT
</span>

</div>


<div class="list">

<div class="list-card">

<div class="row">

<span>Account Type</span>

<strong>Demo</strong>

</div>

</div>


<div class="list-card">

<div class="row">

</div>

</div>


<div class="list-card">

<div class="row">

<span>Version</span>

<strong>1.1 Demo</strong>

</div>

</div>

</div>


<button class="logout"
onclick="logoutDemo()">
Logout
</button>

`;

  }


  content.innerHTML=html;

}


function setActive(page){

  document.querySelectorAll("nav button")
  .forEach(btn=>{

    btn.classList.remove("active");

    if(btn.dataset.page===page){

      btn.classList.add("active");

    }

  });

}


function selectPlan(name){

  alert(
    name +
    " demo plan selected."
  );

}


function demoAction(action){

  alert(
    action +
    " is available only in demo mode."
  );

}


function shareReferral(){

  alert(
    "Demo referral code: CAMPA-DEMO-01"
  );

}


function logoutDemo(){

  document.getElementById("home")
  .classList.remove("active");

  document.getElementById("content")
  .classList.remove("active");

  document.getElementById("auth")
  .style.display="flex";

  showLogin();

}

</script>

</body>
</html>
