<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMPA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f5ff;
      color: #17113d;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: #faf9ff;
    }

    .hero {
      min-height: 100vh;
      padding: 70px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      background: linear-gradient(145deg, #16002f, #5717b8);
    }

    .logo {
      width: 100px;
      height: 100px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #ffb51b, #8a35ff);
      font-size: 42px;
      font-weight: 900;
    }

    h1 {
      margin-top: 22px;
      font-size: 42px;
      letter-spacing: 2px;
    }

    .hero p {
      margin-top: 8px;
      opacity: .85;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .start {
      margin-top: 30px;
      padding: 15px 45px;
      border-radius: 13px;
      background: white;
      color: #5717b8;
      font-weight: 800;
      font-size: 16px;
    }

    .dashboard {
      display: none;
      padding-bottom: 85px;
    }

    header {
      padding: 22px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 22px;
      font-weight: 900;
    }

    .mini-logo {
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: #ffb51b;
      margin-right: 6px;
    }

    .balance {
      margin: 0 20px 20px;
      padding: 24px;
      border-radius: 22px;
      color: white;
      background: linear-gradient(135deg, #5717b8, #8636e8);
    }

    .balance small {
      opacity: .8;
    }

    .balance h2 {
      font-size: 31px;
      margin: 10px 0 20px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .actions button {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      color: #5717b8;
      background: white;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 20px;
    }

    .card {
      padding: 18px 5px;
      border-radius: 15px;
      background: white;
      text-align: center;
      border: 1px solid #eee;
    }

    .card .icon {
      font-size: 23px;
    }

    .card span {
      display: block;
      margin-top: 7px;
      font-size: 12px;
    }

    .invite {
      margin: 20px;
      padding: 20px;
      border-radius: 18px;
      background: #eee5ff;
    }

    .invite h3 {
      margin-bottom: 7px;
    }

    .invite button {
      margin-top: 15px;
      padding: 11px 17px;
      border-radius: 10px;
      color: white;
      background: #5717b8;
      font-weight: 700;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(480px, 100%);
      display: flex;
      justify-content: space-around;
      padding: 11px 5px;
      background: white;
      border-top: 1px solid #eee;
    }

    nav button {
      background: none;
      color: #777;
      font-size: 18px;
    }

    nav span {
      display: block;
      font-size: 10px;
      margin-top: 3px;
    }
  </style>
</head>

<body>

  <div class="app">

    <section class="hero" id="welcome">
      <div class="logo">C↗</div>
      <h1>CAMPA</h1>
      <p>Earn Together, Grow Forever</p>

      <button class="start" onclick="openDashboard()">
        Get Started
      </button>
    </section>

    <section class="dashboard" id="dashboard">

      <header>
        <div>
          <div class="brand">
            <span class="mini-logo">C↗</span>
            CAMPA
          </div>
          <small>Welcome back 👋</small>
        </div>

        <div>🔔</div>
      </header>

      <section class="balance">
        <small>DEMO BALANCE</small>
        <h2>₹ 10,500.00</h2>

        <div class="actions">
          <button>Add Money</button>
          <button>Withdraw</button>
        </div>
      </section>

      <div class="grid">

        <div class="card">
          <div class="icon">📊</div>
          <span>Plans</span>
        </div>

        <div class="card">
          <div class="icon">💰</div>
          <span>Wallet</span>
        </div>

        <div class="card">
          <div class="icon">➕</div>
          <span>Deposit</span>
        </div>

        <div class="card">
          <div class="icon">↥</div>
          <span>Withdraw</span>
        </div>

        <div class="card">
          <div class="icon">👥</div>
          <span>Referral</span>
        </div>

        <div class="card">
          <div class="icon">📜</div>
          <span>History</span>
        </div>

      </div>

      <section class="invite">
        <h3>Invite & Earn</h3>
        <p>Share your referral link and track your demo rewards.</p>

        <button onclick="shareReferral()">
          Share Referral
        </button>
      </section>

      <nav>
        <button onclick="showPage('home')">⌂<span>Home</span></button>
<button onclick="showPage('plans')">▣<span>Plans</span></button>
<button onclick="showPage('wallet')">▤<span>Wallet</span></button>
<button onclick="showPage('referral')">♧<span>Referral</span></button>
<button onclick="showPage('profile')">●<span>Profile</span></button>
      </nav>

    </section>

  </div>

  <script>
   function showPage(page) {
  if (page === "home") {
    alert("CAMPA Home");
  }

  if (page === "plans") {
    alert("CAMPA Plans");
  }

  if (page === "wallet") {
    alert("CAMPA Wallet");
  }

  if (page === "referral") {
    alert("CAMPA Referral");
  }

  if (page === "profile") {
    alert("CAMPA Profile");
  }
   }
    function openDashboard() {
      document.getElementById("welcome").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
    }

    function shareReferral() {
      alert("Demo referral link copied!");
    }
  </script>

</body>
  </html>
